version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./firebase-key.json:/app/firebase-key.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-key.json
      - PORT=8000
      - ENV=production
    restart: unless-stopped 